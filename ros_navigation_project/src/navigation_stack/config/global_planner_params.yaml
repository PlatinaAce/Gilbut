GlobalPlanner:
  allow_unknown: true           # 알 수 없는 영역 허용
  default_tolerance: 3.0        # 허용 오차 증가 (더 일관된 속도)
  visualize_potential: true     # 시각화 활성화
  use_dijkstra: false           # A* 사용 (더 빠름)
  use_quadratic: true
  use_grid_path: false          # 부드러운 경로
  old_navfn_behavior: false
  lethal_cost: 253
  neutral_cost: 50
  cost_factor: 3.0              # 비용 인자
  publish_potential: true       # 퍼텐셜 발행 활성화
  orientation_mode: 0           # 방향 무시
  outline_map: false
