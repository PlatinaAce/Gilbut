# Move Base Behavior Parameters
controller_frequency: 10.0      # 제어 주파수
controller_patience: 15.0       # 타임아웃

planner_frequency: 2.0          # 재계획 주파수 증가 (빠른 초기 계획)
planner_patience: 15.0           # 계획 타임아웃 증가

oscillation_timeout: 10.0       # 진동 타임아웃
oscillation_distance: 0.15

recovery_behavior_enabled: true
clearing_rotation_allowed: true

shutdown_costmaps: false
conservative_reset_dist: 1.0
clearing_radius: 1.0

# 경로 추종
max_planning_retries: 5        # 재시도
planner_time_tolerance: 15.0     # 시간 허용 오차