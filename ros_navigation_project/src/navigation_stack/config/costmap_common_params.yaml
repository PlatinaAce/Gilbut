footprint: [[-1.5, -0.8], [-1.5, 0.8], [1.5, 0.8], [1.5, -0.8]]
footprint_padding: 0.05

robot_base_frame: ego_vehicle
update_frequency: 5.0
publish_frequency: 2.0
transform_tolerance: 2.0

resolution: 0.05

obstacle_range: 50.0
raytrace_range: 50.0

# plugins 섹션 제거 (각 costmap 파일에서 정의)

# Static Layer
static_layer:
  enabled: true
  map_topic: /map

# Obstacle Layer  
obstacle_layer:
  enabled: true
  observation_sources: scan
  
  scan:
    data_type: LaserScan
    topic: /carla/ego_vehicle/lidar/scan
    marking: true
    clearing: true
    min_obstacle_height: 0.0
    max_obstacle_height: 2.0

# Inflation Layer
inflation_layer:
  enabled: true
  inflation_radius: 0.8
  cost_scaling_factor: 5.0
