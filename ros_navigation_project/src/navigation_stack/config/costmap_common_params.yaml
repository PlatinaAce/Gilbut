footprint: [[-2.0, -0.9], [-2.0, 0.9], [2.0, 0.9], [2.0, -0.9]]  # 차량 크기 정확히 반영
footprint_padding: 0.05

robot_base_frame: ego_vehicle
update_frequency: 5.0
publish_frequency: 3.0
transform_tolerance: 0.5

resolution: 0.1

obstacle_range: 40.0         # 장애물 감지 범위 증가
raytrace_range: 50.0         # 레이트레이싱 범위 증가

# plugins 섹션 제거 (각 costmap 파일에서 정의)

# Static Layer
static_layer:
  enabled: true
  map_topic: /map

# Obstacle Layer  
obstacle_layer:
  enabled: true
  observation_sources: scan
  
  scan:
    data_type: LaserScan
    topic: /carla/ego_vehicle/lidar/scan
    marking: true
    clearing: true
    min_obstacle_height: -0.2   # 약간 낮춤 (도로 감지)
    max_obstacle_height: 2.5    # 높임 (차량/건물 감지)
    obstacle_range: 40.0
    raytrace_range: 50.0

# Inflation Layer - 균형잡힌 설정
inflation_layer:
  enabled: true
  inflation_radius: 1.0        # 인플레이션 반경 감소
  cost_scaling_factor: 3.0     # 비용 스케일링 감소
